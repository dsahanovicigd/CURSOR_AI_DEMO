# Pytest configuration specifically for caching tests
# Use this config when running caching tests to avoid global coverage requirements
# Usage: pytest -c tests/pytest_caching.ini tests/test_post_caching.py ...

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --cov=app.cache_utils
    --cov=app.posts.routes
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=70
    -v
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    caching: Caching-related tests
