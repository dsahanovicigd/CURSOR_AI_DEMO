name: Docker Build & Push

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
      
      - name: Check Dockerfile exists
        id: check_dockerfile_frontend
        run: |
          if [ -f "Dockerfile.frontend" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Dockerfile.frontend found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Warning: Dockerfile.frontend not found - skipping build"
            echo "Available files:"
            ls -la | grep -i dockerfile || echo "No Dockerfiles found"
          fi
      
      - name: Build and push frontend image
        if: steps.check_dockerfile_frontend.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
      
      - name: Check flask_api directory and Dockerfile exists
        id: check_dockerfile_backend
        run: |
          if [ -d "flask_api" ] && [ -f "flask_api/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ flask_api/Dockerfile found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Warning: flask_api/Dockerfile not found - skipping build"
            if [ ! -d "flask_api" ]; then
              echo "flask_api directory not found"
              ls -la | head -10
            else
              echo "flask_api directory exists but Dockerfile missing"
              ls -la flask_api/ | grep -i dockerfile || echo "No Dockerfile found in flask_api/"
            fi
          fi
      
      - name: Build and push backend image
        if: steps.check_dockerfile_backend.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./flask_api
          file: ./flask_api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
