name: Unified CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'
  FLASK_APP: 'app:create_app'
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_DRIVER: overlay2

jobs:
  # ============================================================================
  # FRONTEND: Build with Advanced Caching
  # ============================================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      
      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-cache
        with:
          path: |
            node_modules
            ~/.npm
            .npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
            ${{ runner.os }}-
      
      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: |
          npm ci --prefer-offline --no-audit --legacy-peer-deps
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      
      - name: Cache Vite build cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            .vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            ${{ runner.os }}-vite-
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:5001' }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: dist/
          retention-days: 7
          compression-level: 9
          if-no-files-found: error

  # ============================================================================
  # FRONTEND: Parallel Test Execution
  # ============================================================================
  frontend-test-unit:
    name: Frontend Tests - Unit
    runs-on: ubuntu-latest
    needs: frontend-build
    timeout-minutes: 15
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      - name: Run unit tests
        run: |
          npm run test -- auth.spec.ts navigation.spec.ts registration.spec.ts || echo "Tests not found or failed"
        continue-on-error: true

  frontend-test-integration:
    name: Frontend Tests - Integration
    runs-on: ubuntu-latest
    needs: frontend-build
    timeout-minutes: 15
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      
      - name: Run integration tests
        run: |
          npm run test -- product-search.spec.ts task-management.spec.ts accessibility.spec.ts || echo "Tests not found or failed"
        continue-on-error: true

  frontend-test-e2e:
    name: Frontend Tests - E2E
    runs-on: ubuntu-latest
    needs: frontend-build
    timeout-minutes: 15
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      
      - name: Run E2E tests
        run: |
          npm run test -- error-handling.spec.ts responsive.spec.ts || echo "Tests not found or failed"
        continue-on-error: true

  # ============================================================================
  # BACKEND: Build and Lint
  # ============================================================================
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: flask_api/requirements.txt
      
      - name: Cache pip packages
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('flask_api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: ./flask_api
        if: steps.pip-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --cache-dir ~/.cache/pip -r requirements.txt
      
      - name: Verify Flask app
        working-directory: ./flask_api
        run: |
          python -c "import sys; import os; sys.path.insert(0, os.getcwd()); from app import create_app; app = create_app(); print('Flask app created successfully')"
        env:
          FLASK_ENV: development
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-secret-key
          PYTHONPATH: ${{ github.workspace }}/flask_api

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install linting tools
        working-directory: ./flask_api
        run: |
          pip install --cache-dir ~/.cache/pip flake8 black isort mypy
      
      - name: Run flake8
        working-directory: ./flask_api
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true
        continue-on-error: true
      
      - name: Check code formatting
        working-directory: ./flask_api
        run: |
          black --check . || true
        continue-on-error: true
      
      - name: Run mypy
        working-directory: ./flask_api
        run: |
          mypy . --ignore-missing-imports || true
        continue-on-error: true

  # ============================================================================
  # BACKEND: Parallel Test Execution
  # ============================================================================
  backend-test-unit:
    name: Backend Tests - Unit
    runs-on: ubuntu-latest
    needs: backend-build
    timeout-minutes: 20
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: flask_api/requirements.txt
      
      - name: Install dependencies
        working-directory: ./flask_api
        run: |
          python -m pip install --upgrade pip
          pip install --cache-dir ~/.cache/pip -r requirements.txt
          pip install --cache-dir ~/.cache/pip pytest pytest-cov pytest-xdist pytest-timeout
      
      - name: Run unit tests
        working-directory: ./flask_api
        env:
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key
          DATABASE_URL: sqlite:///:memory:
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=html -n auto --maxfail=5 || true
        continue-on-error: true
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-unit
          path: flask_api/htmlcov/
          retention-days: 7

  backend-test-integration:
    name: Backend Tests - Integration
    runs-on: ubuntu-latest
    needs: backend-build
    timeout-minutes: 25
    if: github.event.inputs.skip_tests != 'true'
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: flask_api/requirements.txt
      
      - name: Install dependencies
        working-directory: ./flask_api
        run: |
          python -m pip install --upgrade pip
          pip install --cache-dir ~/.cache/pip -r requirements.txt
          pip install --cache-dir ~/.cache/pip pytest pytest-cov pytest-xdist
      
      - name: Run integration tests
        working-directory: ./flask_api
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          FLASK_ENV: testing
        run: |
          pytest ../qa-automation/tests/integration/backend/ -v --cov=app --cov-report=xml --cov-report=html -n auto || true
        continue-on-error: true

  backend-test-api:
    name: Backend Tests - API
    runs-on: ubuntu-latest
    needs: backend-build
    timeout-minutes: 20
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: flask_api/requirements.txt
      
      - name: Install dependencies
        working-directory: ./flask_api
        run: |
          python -m pip install --upgrade pip
          pip install --cache-dir ~/.cache/pip -r requirements.txt
          pip install --cache-dir ~/.cache/pip pytest pytest-cov pytest-xdist
      
      - name: Run API tests
        working-directory: ./flask_api
        env:
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key
          DATABASE_URL: sqlite:///:memory:
        run: |
          pytest ../qa-automation/tests/integration/backend/test_comprehensive_api_suite.py -v || true
        continue-on-error: true

  # ============================================================================
  # SECURITY: Comprehensive Scanning
  # ============================================================================
  security-frontend:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true
      
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  security-backend:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install security tools
        working-directory: ./flask_api
        run: |
          pip install safety bandit semgrep || true
        continue-on-error: true
      
      - name: Run Safety check
        working-directory: ./flask_api
        run: |
          safety check --json --output safety-report.json || true
        continue-on-error: true
      
      - name: Run Bandit
        working-directory: ./flask_api
        run: |
          bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-backend
          path: |
            flask_api/safety-report.json
            flask_api/bandit-report.json

  security-sast:
    name: SAST Security Scan (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if Python code exists
        id: check_python_code
        run: |
          if [ -d "flask_api/app" ] && [ -f "flask_api/requirements.txt" ] && [ -n "$(find flask_api/app -name '*.py' -type f 2>/dev/null | head -1)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Python code found in flask_api/app"
            find flask_api/app -name '*.py' -type f | head -5
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Python code not found, skipping Python analysis"
          fi
      
      - name: Set CodeQL languages
        id: set_languages
        run: |
          if [ "${{ steps.check_python_code.outputs.exists }}" == "true" ]; then
            echo "languages=javascript,typescript,python" >> $GITHUB_OUTPUT
          else
            echo "languages=javascript,typescript" >> $GITHUB_OUTPUT
          fi
          echo "CodeQL will analyze: ${{ steps.set_languages.outputs.languages }}"
      
      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v4
        id: codeql-init
        with:
          languages: ${{ steps.set_languages.outputs.languages }}
          queries: security-extended,security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  security-container:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # PERFORMANCE: Load and Performance Testing
  # ============================================================================
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build]
    timeout-minutes: 30
    if: github.event.inputs.skip_tests != 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install performance testing tools
        run: |
          pip install locust pytest-benchmark || echo "Performance tools installation failed"
        continue-on-error: true
      
      - name: Start backend server
        working-directory: ./flask_api
        run: |
          export FLASK_ENV=testing
          export DATABASE_URL=sqlite:///:memory:
          python -m flask run --port=5001 &
          sleep 10
        continue-on-error: true
      
      - name: Run Locust load test
        working-directory: ./flask_api
        run: |
          locust -f tests/load_test.py --headless -u 50 -r 10 -t 30s --html locust-report.html || true
        continue-on-error: true
      
      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: |
            flask_api/locust-report.html

  # ============================================================================
  # DOCKER: Build Images
  # ============================================================================
  docker-build-frontend:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    needs: [frontend-build, frontend-test-unit, frontend-test-integration]
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: github.event_name != 'pull_request'
      
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: dist/
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/frontend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/frontend:buildcache,mode=max

  docker-build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: [backend-build, backend-test-unit]
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: github.event_name != 'pull_request'
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./flask_api
          file: ./flask_api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/backend:buildcache,mode=max

  # ============================================================================
  # DEPLOYMENT: Blue-Green Strategy
  # ============================================================================
  deploy-staging:
    name: Deploy Staging (Blue-Green)
    runs-on: ubuntu-latest
    needs: [
      frontend-build,
      frontend-test-unit,
      frontend-test-integration,
      backend-build,
      backend-test-unit,
      security-sast,
      docker-build-frontend,
      docker-build-backend
    ]
    if: |
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL || 'https://staging.example.com' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine active environment
        id: env-check
        run: |
          CURRENT_ENV=$(curl -s ${{ secrets.STAGING_URL }}/env 2>/dev/null || echo "blue")
          if [ "$CURRENT_ENV" = "blue" ]; then
            echo "new_env=green" >> $GITHUB_OUTPUT
            echo "old_env=blue" >> $GITHUB_OUTPUT
          else
            echo "new_env=blue" >> $GITHUB_OUTPUT
            echo "old_env=green" >> $GITHUB_OUTPUT
          fi
      
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: dist/
      
      - name: Deploy to ${{ steps.env-check.outputs.new_env }} environment
        id: deploy
        run: |
          echo "Deploying to staging-${{ steps.env-check.outputs.new_env }}..."
          # Add your staging deployment commands here
          echo "status=deployed" >> $GITHUB_OUTPUT
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_ENV: ${{ steps.env-check.outputs.new_env }}
      
      - name: Run smoke tests
        id: smoke-tests
        run: |
          echo "Running smoke tests on staging-${{ steps.env-check.outputs.new_env }}..."
          # curl -f ${{ secrets.STAGING_URL }}/api/health || exit 1
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Switch traffic to ${{ steps.env-check.outputs.new_env }}
        if: steps.smoke-tests.outputs.status == 'success'
        run: |
          echo "Switching traffic to staging-${{ steps.env-check.outputs.new_env }}..."
          # Update load balancer configuration
          echo "Traffic switched successfully"

  deploy-production:
    name: Deploy Production (Blue-Green)
    runs-on: ubuntu-latest
    needs: [
      frontend-build,
      frontend-test-unit,
      frontend-test-integration,
      frontend-test-e2e,
      backend-build,
      backend-test-unit,
      backend-test-integration,
      backend-test-api,
      security-sast,
      security-frontend,
      security-backend,
      security-container,
      performance-test,
      docker-build-frontend,
      docker-build-backend
    ]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL || 'https://example.com' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine active environment
        id: env-check
        run: |
          CURRENT_ENV=$(curl -s ${{ secrets.PRODUCTION_URL }}/env 2>/dev/null || echo "blue")
          if [ "$CURRENT_ENV" = "blue" ]; then
            echo "new_env=green" >> $GITHUB_OUTPUT
            echo "old_env=blue" >> $GITHUB_OUTPUT
          else
            echo "new_env=blue" >> $GITHUB_OUTPUT
            echo "old_env=green" >> $GITHUB_OUTPUT
          fi
      
      - name: Create deployment record
        id: deployment
        run: |
          echo "deployment_id=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "environment=${{ steps.env-check.outputs.new_env }}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
      
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: dist/
      
      - name: Deploy to ${{ steps.env-check.outputs.new_env }} environment
        id: deploy
        run: |
          echo "Deploying to production-${{ steps.env-check.outputs.new_env }}..."
          # Add your production deployment commands here
          echo "status=deployed" >> $GITHUB_OUTPUT
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_ENV: ${{ steps.env-check.outputs.new_env }}
      
      - name: Run comprehensive smoke tests
        id: smoke-tests
        run: |
          echo "Running smoke tests on production-${{ steps.env-check.outputs.new_env }}..."
          # Comprehensive health checks
          # curl -f ${{ secrets.PRODUCTION_URL }}/api/health || exit 1
          # Run critical path tests
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Switch traffic to ${{ steps.env-check.outputs.new_env }}
        if: steps.smoke-tests.outputs.status == 'success'
        id: switch-traffic
        run: |
          echo "Switching traffic to production-${{ steps.env-check.outputs.new_env }}..."
          # Update load balancer configuration
          echo "status=switched" >> $GITHUB_OUTPUT
      
      - name: Monitor deployment health
        id: monitor
        if: steps.switch-traffic.outputs.status == 'switched'
        run: |
          echo "Monitoring deployment health for 5 minutes..."
          for i in {1..30}; do
            # Health check logic
            # ERROR_RATE=$(curl -s ${{ secrets.PRODUCTION_URL }}/metrics | grep error_rate)
            # RESPONSE_TIME=$(curl -s ${{ secrets.PRODUCTION_URL }}/metrics | grep response_time)
            # if (( $(echo "$ERROR_RATE > 5" | bc -l) )) || (( $(echo "$RESPONSE_TIME > 1000" | bc -l) )); then
            #   echo "status=unhealthy" >> $GITHUB_OUTPUT
            #   exit 1
            # fi
            sleep 10
          done
          echo "status=healthy" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Rollback on failure
        if: failure() || steps.monitor.outputs.status == 'unhealthy'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = '${{ steps.deployment.outputs.deployment_id }}';
            const oldEnv = '${{ steps.env-check.outputs.old_env }}';
            
            console.log(`Rolling back deployment ${deploymentId} to ${oldEnv} environment`);
            
            // Switch traffic back to old environment
            // Add rollback commands here
            
            // Create deployment status (if deployment exists)
            try {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deploymentId,
                state: 'failure',
                description: `Rolled back to ${oldEnv} environment due to health check failures`
              });
            } catch (error) {
              console.log(`Could not update deployment status: ${error.message}`);
              // Continue even if deployment status update fails
            }
            
            console.log('Rollback completed.');

  # ============================================================================
  # NOTIFICATIONS
  # ============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [
      deploy-staging,
      deploy-production
    ]
    if: always()
    
    steps:
      - name: Determine workflow status
        id: status
        run: |
          if [ "${{ needs.deploy-staging.result }}" == "success" ] || [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Slack notification
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "${{ steps.status.outputs.status == 'success' && '✅' || '❌' }} Deployment ${{ steps.status.outputs.status }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.status.outputs.status == 'success' && '✅ Deployment Successful' || '❌ Deployment Failed' }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:*\n${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Workflow:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
