name: Optimized CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'
  FLASK_APP: 'app:create_app'
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ============================================================================
  # FRONTEND: Build and Test (Optimized with Caching)
  # ============================================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      - name: Run linter
        run: npm run lint
        continue-on-error: true
      
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:5001' }}
          NODE_OPTIONS: '--max-old-space-size=4096'
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: dist/
          retention-days: 7
          compression-level: 6

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend-build
    
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Run Playwright tests (shard ${{ matrix.shard }})
        run: npm run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        continue-on-error: true
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
      
      - name: Upload test videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-videos-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  # ============================================================================
  # BACKEND: Build and Test (Optimized with Caching)
  # ============================================================================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check flask_api directory exists
        id: check_flask_api
        run: |
          if [ -f "flask_api/requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: flask_api/requirements.txt not found, skipping pip cache"
          fi
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ steps.check_flask_api.outputs.exists == 'true' && 'pip' || '' }}
          cache-dependency-path: ${{ steps.check_flask_api.outputs.exists == 'true' && 'flask_api/requirements.txt' || '' }}
      
      - name: Cache pip packages
        if: steps.check_flask_api.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('flask_api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install linting dependencies
        working-directory: ./flask_api
        run: |
          pip install --cache-dir ~/.cache/pip flake8 black isort mypy
      
      - name: Run flake8
        working-directory: ./flask_api
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true
        continue-on-error: true
      
      - name: Check code formatting with black
        working-directory: ./flask_api
        run: |
          black --check . || true
        continue-on-error: true
      
      - name: Type checking with mypy
        working-directory: ./flask_api
        run: |
          mypy . --ignore-missing-imports || true
        continue-on-error: true

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    strategy:
      fail-fast: false
      matrix:
        test-group: [unit, integration, ecommerce, comprehensive]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check flask_api directory exists
        id: check_flask_api
        run: |
          if [ -f "flask_api/requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: flask_api/requirements.txt not found, skipping pip cache"
          fi
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ steps.check_flask_api.outputs.exists == 'true' && 'pip' || '' }}
          cache-dependency-path: ${{ steps.check_flask_api.outputs.exists == 'true' && 'flask_api/requirements.txt' || '' }}
      
      - name: Cache pip packages
        if: steps.check_flask_api.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('flask_api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: ./flask_api
        run: |
          python -m pip install --upgrade pip
          pip install --cache-dir ~/.cache/pip -r requirements.txt
          pip install --cache-dir ~/.cache/pip pytest pytest-cov pytest-xdist pytest-timeout
      
      - name: 'Run tests (group: ${{ matrix.test-group }})'
        working-directory: ./flask_api
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-secret-key
        run: |
          case "${{ matrix.test-group }}" in
            unit)
              pytest ../qa-automation/tests/unit/backend/ -v --cov=app --cov-report=xml --cov-report=term -n auto || echo "Unit tests not found"
              ;;
            integration)
              pytest ../qa-automation/tests/integration/backend/ -v --cov=app --cov-report=xml --cov-report=term -n auto || echo "Integration tests not found"
              ;;
            ecommerce)
              pytest ../qa-automation/tests/integration/backend/test_ecommerce*.py -v --cov=app --cov-report=xml --cov-report=term -n auto || echo "E-commerce tests not found"
              ;;
            comprehensive)
              pytest ../qa-automation/tests/integration/backend/test_comprehensive_api_suite.py -v --cov=app --cov-report=xml --cov-report=term -n auto || echo "Comprehensive tests not found"
              ;;
          esac
        continue-on-error: true
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./flask_api/coverage.xml
          flags: backend-${{ matrix.test-group }}
          name: backend-coverage-${{ matrix.test-group }}
          fail_ci_if_error: false
      
      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-${{ matrix.test-group }}
          path: flask_api/htmlcov/
          retention-days: 7

  # ============================================================================
  # SECURITY: SAST and Dependency Scanning
  # ============================================================================
  security-sast:
    name: SAST Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if Python code exists
        id: check_python_code
        run: |
          if [ -d "flask_api" ] && [ -f "flask_api/requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Python code not found, skipping Python analysis"
          fi
      
      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ steps.check_python_code.outputs.exists == 'true' && 'javascript,typescript,python' || 'javascript,typescript' }}
          queries: security-extended,security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
      
      - name: Run Bandit (Python SAST)
        working-directory: ./flask_api
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true
        continue-on-error: true
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: flask_api/bandit-report.json

  security-dependencies:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate --json > npm-audit.json || true
        continue-on-error: true
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Run Safety check
        working-directory: ./flask_api
        run: |
          pip install safety
          safety check --json --output safety-report.json || true
        continue-on-error: true
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            npm-audit.json
            flask_api/safety-report.json
            trivy-results.sarif

  # ============================================================================
  # PERFORMANCE: Load and Performance Testing
  # ============================================================================
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test]
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install performance testing tools
        run: |
          pip install locust pytest-benchmark || echo "Performance tools installation failed"
        continue-on-error: true
      
      - name: Start backend server
        working-directory: ./flask_api
        run: |
          export FLASK_ENV=testing
          export DATABASE_URL=sqlite:///:memory:
          flask run --port=5001 &
          sleep 10
        env:
          FLASK_APP: app:create_app
          SECRET_KEY: test-secret-key
      
      - name: Run API performance tests
        working-directory: ./flask_api
        run: |
          pytest ../qa-automation/tests/integration/backend/test_comprehensive_api_suite.py::TestPerformance -v --benchmark-only || echo "Performance tests not found"
        continue-on-error: true
      
      - name: Run Locust load tests
        working-directory: ./flask_api
        run: |
          locust -f tests/load_test.py --headless -u 50 -r 10 -t 30s --html locust-report.html || true
        continue-on-error: true
      
      - name: Upload performance reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: |
            flask_api/locust-report.html
            flask_api/.benchmarks/
          retention-days: 7
      
      - name: Check response time thresholds
        run: |
          echo "Performance tests completed. Check artifacts for detailed reports."

  # ============================================================================
  # DEPLOYMENT: Blue-Green Deployment Strategy
  # ============================================================================
  deploy-staging-blue-green:
    name: Deploy Staging (Blue-Green)
    runs-on: ubuntu-latest
    needs: [frontend-build, frontend-test, backend-test, security-sast, security-dependencies]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging-blue.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine active environment
        id: env-check
        run: |
          # Check which environment is currently active
          CURRENT_ENV=$(curl -s https://staging.example.com/env || echo "blue")
          if [ "$CURRENT_ENV" = "blue" ]; then
            echo "new_env=green" >> $GITHUB_OUTPUT
            echo "old_env=blue" >> $GITHUB_OUTPUT
          else
            echo "new_env=blue" >> $GITHUB_OUTPUT
            echo "old_env=green" >> $GITHUB_OUTPUT
          fi
      
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: dist/
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install backend dependencies
        working-directory: ./flask_api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Deploy to ${{ steps.env-check.outputs.new_env }} environment
        id: deploy
        run: |
          echo "Deploying to staging-${{ steps.env-check.outputs.new_env }}..."
          # Add your deployment commands here
          # Examples:
          # - Deploy to staging-blue or staging-green
          # - Update load balancer to point to new environment
          # - Run database migrations
          echo "deployment_id=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "environment=${{ steps.env-check.outputs.new_env }}" >> $GITHUB_OUTPUT
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          DEPLOY_ENV: ${{ steps.env-check.outputs.new_env }}
      
      - name: Run smoke tests on ${{ steps.env-check.outputs.new_env }}
        id: smoke-tests
        run: |
          echo "Running smoke tests on staging-${{ steps.env-check.outputs.new_env }}..."
          # Add smoke test commands
          # curl -f https://staging-${{ steps.env-check.outputs.new_env }}.example.com/api/health || exit 1
          # Add more comprehensive health checks
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Switch traffic to ${{ steps.env-check.outputs.new_env }}
        if: steps.smoke-tests.outputs.status == 'success'
        run: |
          echo "Switching traffic to staging-${{ steps.env-check.outputs.new_env }}..."
          # Update load balancer/nginx config to point to new environment
          # kubectl set selector service staging-app env=${{ steps.env-check.outputs.new_env }}
          echo "Traffic switched successfully"
      
      - name: Monitor deployment
        run: |
          echo "Monitoring deployment for 60 seconds..."
          # Monitor metrics, error rates, response times
          # If metrics look good, continue; otherwise rollback
          sleep 60
      
      - name: Cleanup old environment
        if: success()
        run: |
          echo "Cleaning up staging-${{ steps.env-check.outputs.old_env }}..."
          # Optionally clean up old environment after successful deployment
          # Keep it for quick rollback if needed

  deploy-production-blue-green:
    name: Deploy Production (Blue-Green)
    runs-on: ubuntu-latest
    needs: [frontend-build, frontend-test, backend-test, security-sast, security-dependencies, performance-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Determine active environment
        id: env-check
        run: |
          CURRENT_ENV=$(curl -s https://example.com/env || echo "blue")
          if [ "$CURRENT_ENV" = "blue" ]; then
            echo "new_env=green" >> $GITHUB_OUTPUT
            echo "old_env=blue" >> $GITHUB_OUTPUT
          else
            echo "new_env=blue" >> $GITHUB_OUTPUT
            echo "old_env=green" >> $GITHUB_OUTPUT
          fi
      
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: dist/
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install backend dependencies
        working-directory: ./flask_api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create deployment record
        id: deployment
        run: |
          echo "deployment_id=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "environment=${{ steps.env-check.outputs.new_env }}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
      
      - name: Deploy to ${{ steps.env-check.outputs.new_env }} environment
        id: deploy
        run: |
          echo "Deploying to production-${{ steps.env-check.outputs.new_env }}..."
          # Add your production deployment commands here
          echo "status=deployed" >> $GITHUB_OUTPUT
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_ENV: ${{ steps.env-check.outputs.new_env }}
      
      - name: Run smoke tests on ${{ steps.env-check.outputs.new_env }}
        id: smoke-tests
        run: |
          echo "Running smoke tests on production-${{ steps.env-check.outputs.new_env }}..."
          # Comprehensive smoke tests
          # curl -f https://production-${{ steps.env-check.outputs.new_env }}.example.com/api/health || exit 1
          # Run critical path tests
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Switch traffic to ${{ steps.env-check.outputs.new_env }}
        if: steps.smoke-tests.outputs.status == 'success'
        id: switch-traffic
        run: |
          echo "Switching traffic to production-${{ steps.env-check.outputs.new_env }}..."
          # Update load balancer to point to new environment
          # kubectl set selector service production-app env=${{ steps.env-check.outputs.new_env }}
          echo "status=switched" >> $GITHUB_OUTPUT
      
      - name: Monitor deployment health
        id: monitor
        run: |
          echo "Monitoring deployment for 120 seconds..."
          # Monitor error rates, response times, CPU, memory
          # Check metrics every 10 seconds
          for i in {1..12}; do
            ERROR_RATE=$(curl -s https://monitoring.example.com/metrics/error-rate || echo "0")
            RESPONSE_TIME=$(curl -s https://monitoring.example.com/metrics/response-time || echo "0")
            echo "Check $i: Error rate=$ERROR_RATE, Response time=$RESPONSE_TIME"
            
            # If error rate > 5% or response time > 1000ms, trigger rollback
            if (( $(echo "$ERROR_RATE > 5" | bc -l) )) || (( $(echo "$RESPONSE_TIME > 1000" | bc -l) )); then
              echo "status=unhealthy" >> $GITHUB_OUTPUT
              exit 1
            fi
            sleep 10
          done
          echo "status=healthy" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Rollback on failure
        if: failure() || steps.monitor.outputs.status == 'unhealthy'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = '${{ steps.deployment.outputs.deployment_id }}';
            const oldEnv = '${{ steps.env-check.outputs.old_env }}';
            
            console.log(`Rolling back deployment ${deploymentId} to ${oldEnv} environment`);
            
            // Switch traffic back to old environment
            // Add rollback commands here
            
            // Create deployment status (if deployment exists)
            try {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deploymentId,
                state: 'failure',
                description: `Rolled back to ${oldEnv} environment due to health check failures`
              });
            } catch (error) {
              console.log(`Could not update deployment status: ${error.message}`);
              // Continue even if deployment status update fails
            }
            
            // Send notification
            console.log('Rollback completed. Notification sent.');
      
      - name: Cleanup old environment (after 24h)
        if: success() && steps.monitor.outputs.status == 'healthy'
        run: |
          echo "Deployment successful. Old environment will be cleaned up after 24 hours."
          # Schedule cleanup job or keep old environment for quick rollback

  # ============================================================================
  # MONITORING: Integration and Alerts
  # ============================================================================
  monitoring-integration:
    name: Monitoring Integration
    runs-on: ubuntu-latest
    needs: [deploy-production-blue-green]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Send deployment metrics to monitoring
        run: |
          DEPLOYMENT_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          
          # Send to monitoring service (Datadog, New Relic, Prometheus, etc.)
          curl -X POST https://monitoring.example.com/api/metrics \
            -H "Content-Type: application/json" \
            -d "{
              \"metric\": \"deployment.completed\",
              \"value\": 1,
              \"tags\": {
                \"environment\": \"production\",
                \"commit\": \"$COMMIT_SHA\",
                \"branch\": \"$BRANCH\",
                \"deployment_time\": \"$DEPLOYMENT_TIME\"
              }
            }" || true
      
      - name: Create monitoring dashboard
        run: |
          echo "Creating/updating monitoring dashboard..."
          # Create or update Grafana/Datadog dashboard
          # Include: error rates, response times, throughput, resource usage
      
      - name: Set up alerting rules
        run: |
          echo "Configuring alerting rules..."
          # Configure alerts for:
          # - Error rate > 1%
          # - Response time > 500ms
          # - CPU usage > 80%
          # - Memory usage > 85%
          # - Failed health checks

  # ============================================================================
  # NOTIFICATION: Status Report
  # ============================================================================
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [frontend-build, frontend-test, backend-test, deploy-staging-blue-green, deploy-production-blue-green, monitoring-integration]
    if: always()
    
    steps:
      - name: Determine workflow status
        id: status
        run: |
          if [ "${{ needs.frontend-build.result }}" = "success" ] && \
             [ "${{ needs.backend-test.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
      
      - name: Send Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ steps.status.outputs.status }}
          text: |
            Workflow: ${{ github.workflow }}
            Status: ${{ steps.status.outputs.status }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true
      
      - name: Send email notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI/CD Pipeline Failed: ${{ github.workflow }}"
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          body: |
            Workflow: ${{ github.workflow }}
            Status: Failed
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Author: ${{ github.actor }}
            View logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
