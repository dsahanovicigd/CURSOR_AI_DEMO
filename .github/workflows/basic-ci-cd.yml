name: Optimized CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ============================================================================
  # SECURITY SCANNING (Run in parallel, non-blocking)
  # ============================================================================
  security-frontend:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
        continue-on-error: true
      
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  security-backend:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check flask_api directory exists
        id: check_flask_api
        run: |
          if [ -f "flask_api/requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: flask_api/requirements.txt not found, skipping pip cache"
          fi
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ steps.check_flask_api.outputs.exists == 'true' && 'pip' || '' }}
          cache-dependency-path: ${{ steps.check_flask_api.outputs.exists == 'true' && 'flask_api/requirements.txt' || '' }}
      
      - name: Install dependencies
        working-directory: ./flask_api
        run: |
          python -m pip install --upgrade pip
          pip install safety pip-audit
      
      - name: Run pip-audit
        working-directory: ./flask_api
        run: pip-audit --desc || true
        continue-on-error: true
      
      - name: Run Snyk security scan
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=./flask_api/requirements.txt

  # ============================================================================
  # BUILD STAGE (Optimized with caching)
  # ============================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Cache Vite build
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('src/**', 'vite.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-vite-
      
      - name: Install dependencies
        run: npm ci --prefer-offline
      
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:5001' }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7
          compression-level: 6

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check flask_api directory exists
        run: |
          if [ ! -d "flask_api" ] || [ ! -f "flask_api/requirements.txt" ]; then
            echo "Warning: flask_api/requirements.txt not found, skipping pip cache"
            exit 0
          fi
      
      - name: Check flask_api directory exists
        id: check_flask_api
        run: |
          if [ -f "flask_api/requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: flask_api/requirements.txt not found, skipping pip cache"
          fi
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ steps.check_flask_api.outputs.exists == 'true' && 'pip' || '' }}
          cache-dependency-path: ${{ steps.check_flask_api.outputs.exists == 'true' && 'flask_api/requirements.txt' || '' }}
        continue-on-error: true
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('flask_api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: ./flask_api
        run: |
          python -m pip install --upgrade pip
          pip install --cache-dir ~/.cache/pip -r requirements.txt
      
      - name: Verify Flask app
        working-directory: ./flask_api
        run: |
          python -c "from app import create_app; app = create_app(); print('Flask app created successfully')"
        env:
          FLASK_ENV: development
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-secret-key

  # ============================================================================
  # TEST STAGE (Split into parallel jobs for speed)
  # ============================================================================
  test-frontend-unit:
    name: Frontend Tests - Unit
    runs-on: ubuntu-latest
    needs: build-frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      - name: Install dependencies
        run: npm ci --prefer-offline
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Run frontend tests (auth, navigation, registration)
        run: |
          npm run test -- qa-automation/tests/e2e/frontend/auth.spec.ts qa-automation/tests/e2e/frontend/navigation.spec.ts qa-automation/tests/e2e/frontend/registration.spec.ts
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-unit
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test-frontend-integration:
    name: Frontend Tests - Integration
    runs-on: ubuntu-latest
    needs: build-frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      - name: Install dependencies
        run: npm ci --prefer-offline
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Run frontend tests (product-search, task-management, accessibility)
        run: |
          npm run test -- qa-automation/tests/e2e/frontend/product-search.spec.ts qa-automation/tests/e2e/frontend/task-management.spec.ts qa-automation/tests/e2e/frontend/accessibility.spec.ts
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-integration
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test-frontend-e2e:
    name: Frontend Tests - E2E
    runs-on: ubuntu-latest
    needs: build-frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      
      - name: Install dependencies
        run: npm ci --prefer-offline
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Run frontend tests (error-handling, responsive)
        run: |
          npm run test -- qa-automation/tests/e2e/frontend/error-handling.spec.ts qa-automation/tests/e2e/frontend/responsive.spec.ts
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test-backend-unit:
    name: Backend Tests - Unit
    runs-on: ubuntu-latest
    needs: build-backend
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check flask_api directory exists
        run: |
          if [ ! -d "flask_api" ] || [ ! -f "flask_api/requirements.txt" ]; then
            echo "Warning: flask_api/requirements.txt not found, skipping pip cache"
            exit 0
          fi
      
      - name: Check flask_api directory exists
        id: check_flask_api
        run: |
          if [ -f "flask_api/requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: flask_api/requirements.txt not found, skipping pip cache"
          fi
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ steps.check_flask_api.outputs.exists == 'true' && 'pip' || '' }}
          cache-dependency-path: ${{ steps.check_flask_api.outputs.exists == 'true' && 'flask_api/requirements.txt' || '' }}
        continue-on-error: true
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('flask_api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: ./flask_api
        run: |
          python -m pip install --upgrade pip
          pip install --cache-dir ~/.cache/pip -r requirements.txt
      
      - name: Run unit tests (models, validation, helpers)
        working-directory: ./flask_api
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-secret-key
        run: |
          pytest tests/test_models.py tests/test_validation.py tests/test_helpers.py \
            -v --cov=app --cov-report=xml --cov-report=term -n auto
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-unit
          path: flask_api/coverage.xml
          retention-days: 7

  test-backend-api:
    name: Backend Tests - API
    runs-on: ubuntu-latest
    needs: build-backend
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check flask_api directory exists
        run: |
          if [ ! -d "flask_api" ] || [ ! -f "flask_api/requirements.txt" ]; then
            echo "Warning: flask_api/requirements.txt not found, skipping pip cache"
            exit 0
          fi
      
      - name: Check flask_api directory exists
        id: check_flask_api
        run: |
          if [ -f "flask_api/requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: flask_api/requirements.txt not found, skipping pip cache"
          fi
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ steps.check_flask_api.outputs.exists == 'true' && 'pip' || '' }}
          cache-dependency-path: ${{ steps.check_flask_api.outputs.exists == 'true' && 'flask_api/requirements.txt' || '' }}
        continue-on-error: true
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('flask_api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: ./flask_api
        run: |
          python -m pip install --upgrade pip
          pip install --cache-dir ~/.cache/pip -r requirements.txt
      
      - name: Run API tests (auth, posts, tasks, tickets)
        working-directory: ./flask_api
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-secret-key
        run: |
          pytest tests/test_auth.py tests/test_posts.py tests/test_tasks.py tests/test_tickets.py \
            -v --cov=app --cov-report=xml --cov-report=term -n auto
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-api
          path: flask_api/coverage.xml
          retention-days: 7

  test-backend-integration:
    name: Backend Tests - Integration
    runs-on: ubuntu-latest
    needs: build-backend
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check flask_api directory exists
        run: |
          if [ ! -d "flask_api" ] || [ ! -f "flask_api/requirements.txt" ]; then
            echo "Warning: flask_api/requirements.txt not found, skipping pip cache"
            exit 0
          fi
      
      - name: Check flask_api directory exists
        id: check_flask_api
        run: |
          if [ -f "flask_api/requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Warning: flask_api/requirements.txt not found, skipping pip cache"
          fi
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ steps.check_flask_api.outputs.exists == 'true' && 'pip' || '' }}
          cache-dependency-path: ${{ steps.check_flask_api.outputs.exists == 'true' && 'flask_api/requirements.txt' || '' }}
        continue-on-error: true
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('flask_api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        working-directory: ./flask_api
        run: |
          python -m pip install --upgrade pip
          pip install --cache-dir ~/.cache/pip -r requirements.txt
      
      - name: Run integration tests (comprehensive, ecommerce, performance)
        working-directory: ./flask_api
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key
          JWT_SECRET_KEY: test-jwt-secret-key
        run: |
          pytest tests/test_comprehensive_api_suite.py tests/test_ecommerce_*.py tests/test_performance.py \
            -v --cov=app --cov-report=xml --cov-report=term -n auto
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-integration
          path: flask_api/coverage.xml
          retention-days: 7

  # ============================================================================
  # DEPLOY STAGE (With Docker layer caching and health checks)
  # ============================================================================
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: 
      - build-frontend
      - build-backend
      - test-frontend-unit
      - test-frontend-integration
      - test-frontend-e2e
      - test-backend-unit
      - test-backend-api
      - test-backend-integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/
      
      - name: Build and push frontend Docker image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/frontend:${{ github.sha }},${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production
            VITE_API_URL=${{ secrets.VITE_API_URL || 'http://localhost:5001' }}
      
      - name: Check flask_api directory exists
        run: |
          if [ ! -d "flask_api" ]; then
            echo "Error: flask_api directory not found"
            ls -la
            exit 1
          fi
          if [ ! -f "flask_api/Dockerfile" ]; then
            echo "Error: flask_api/Dockerfile not found"
            exit 1
          fi
      
      - name: Build and push backend Docker image (with cache)
        uses: docker/build-push-action@v5
        with:
          context: ./flask_api
          file: ./flask_api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/backend:${{ github.sha }},${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Deploy to production
        run: |
          echo "🚀 Deploying application..."
          echo "Frontend image: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/frontend:${{ github.sha }}"
          echo "Backend image: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/backend:${{ github.sha }}"
          echo ""
          echo "📝 Add your deployment commands here:"
          echo "  - kubectl set image deployment/frontend frontend=${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/frontend:${{ github.sha }}"
          echo "  - kubectl set image deployment/backend backend=${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository }}/backend:${{ github.sha }}"
          echo "  - docker-compose up -d"
          echo "  - AWS ECS update-service"
          echo "  - Google Cloud Run deploy"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      
      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for services to be ready..."
          sleep 30
      
      - name: Health check - Frontend
        run: |
          echo "🏥 Checking frontend health..."
          max_attempts=10
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if curl -f -s -o /dev/null -w "%{http_code}" ${{ secrets.FRONTEND_URL || 'https://example.com' }}/ | grep -q "200\|301\|302"; then
              echo "✅ Frontend is healthy!"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts failed, retrying in 5 seconds..."
            sleep 5
            attempt=$((attempt + 1))
          done
          echo "❌ Frontend health check failed after $max_attempts attempts"
          exit 1
        continue-on-error: true
      
      - name: Health check - Backend API
        run: |
          echo "🏥 Checking backend API health..."
          max_attempts=10
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if curl -f -s ${{ secrets.BACKEND_URL || 'https://api.example.com' }}/api/health | grep -q "ok\|healthy"; then
              echo "✅ Backend API is healthy!"
              exit 0
            fi
            echo "Attempt $attempt/$max_attempts failed, retrying in 5 seconds..."
            sleep 5
            attempt=$((attempt + 1))
          done
          echo "❌ Backend API health check failed after $max_attempts attempts"
          exit 1
        continue-on-error: true
      
      - name: Run smoke tests
        run: |
          echo "✅ Running comprehensive smoke tests..."
          # Frontend smoke tests
          curl -f ${{ secrets.FRONTEND_URL || 'https://example.com' }}/ || exit 1
          # Backend API smoke tests
          curl -f ${{ secrets.BACKEND_URL || 'https://api.example.com' }}/api/health || exit 1
          echo "✅ All smoke tests passed!"

  # ============================================================================
  # NOTIFICATION: Slack alerts for failures
  # ============================================================================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: 
      - build-frontend
      - build-backend
      - test-frontend-unit
      - test-frontend-integration
      - test-frontend-e2e
      - test-backend-unit
      - test-backend-api
      - test-backend-integration
      - security-frontend
      - security-backend
      - deploy
    if: failure() && github.event_name != 'pull_request'
    
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
