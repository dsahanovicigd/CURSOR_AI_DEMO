# SonarQube Project Configuration
sonar.projectKey=cursor-ai-demo
sonar.projectName=Cursor AI Demo
sonar.projectVersion=1.0

# Source code
sonar.sources=src,flask_api/app
sonar.tests=qa-automation/tests

# Language
sonar.language=ts,js,python

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.venv/**,**/venv/**,**/*.min.js,**/*.min.css

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=flask_api/htmlcov/coverage.xml

# TypeScript/JavaScript
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Python
sonar.python.file.suffixes=.py

# Encoding
sonar.sourceEncoding=UTF-8
